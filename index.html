<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 첫 웹페이지</title>
  <style>
    :root { --bg: #eaf2fb; --card: #ffffff; --text: #0f2a47; --muted: #4a6582; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1626; --card: #13233a; --text: #e6efff; --muted: #9db3cf; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 16px;
    }
    .card {
      background: var(--card); max-width: 480px; width: 100%;
      padding: 40px 32px; border-radius: 16px; text-align: center;
      box-shadow: 0 4px 24px rgba(37,99,235,.12);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 999px;
      padding: 12px 28px; font-size: 16px; cursor: pointer;
    }
    #msg { margin-top: 20px; min-height: 1.5em; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <h1>👋 안녕하세요!</h1>
    <p>Claude Code와 함께 만든 나의 첫 웹페이지예요.<br>GitHub Pages로 인터넷에 공개되었습니다.</p>
    <button onclick="cheer()">눌러보세요</button>
    <div id="msg"></div>
  </main>
  <script>
    const lines = ["첫 웹페이지 완성! 🎉", "코딩 시작이 반이에요 💪", "다음엔 뭘 만들어 볼까요? ✨"];
    let i = 0;
    function cheer() { document.getElementById("msg").textContent = lines[i++ % lines.length]; }
  </script>
</body>
</html>
